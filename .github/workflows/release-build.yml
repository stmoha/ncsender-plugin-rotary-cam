name: Build and Release Plugin

# Runs when a release is published on GitHub (which creates its tag vX.Y.Z):
# checks the tag matches manifest.json, rebuilds the 3D view, runs the tests,
# packages com.cncdocs.rotary-cam_vX.Y.Z.zip, attaches it to the release and
# posts the release to Discord. ncSender's update badge reads the latest
# release through the manifest's "repository" field.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Plugin Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get plugin info
        id: plugin_info
        run: |
          PLUGIN_ID=$(jq -r '.id' manifest.json)
          PLUGIN_NAME=$(jq -r '.name' manifest.json)
          PLUGIN_VERSION=$(jq -r '.version' manifest.json)
          TAG="${{ github.ref_name }}"
          echo "PLUGIN_ID=$PLUGIN_ID" >> $GITHUB_OUTPUT
          echo "PLUGIN_NAME=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Plugin: $PLUGIN_ID ($PLUGIN_NAME) $PLUGIN_VERSION, tag $TAG"
          # ncSender compares the tag with the installed manifest's version: a
          # tag that doesn't match would show "Update available" for ever.
          if [ "$TAG" != "v$PLUGIN_VERSION" ]; then
            echo "::error::Tag $TAG doesn't match manifest.json version $PLUGIN_VERSION - publish the release as v$PLUGIN_VERSION (or bump manifest.json first)"
            exit 1
          fi

      - name: Rebuild the 3D view bundle
        run: |
          # lib/rotary-viewer.js is built from viewer/src; rebuild it so the
          # release always matches the sources.
          (cd viewer && npm ci --no-audit --no-fund)
          (cd viewer && node build.mjs)
          if ! git diff --quiet -- lib/rotary-viewer.js; then
            echo "::warning::Committed lib/rotary-viewer.js was stale; the release uses the freshly built one."
          fi

      - name: Tests
        run: |
          node test/tenon-test.js
          node test/route-test.js
          node test/project-test.js test/horn.stl
          node test/ztravel-test.js
          node test/indexside-test.js
          node test/drop-test.js

      - name: Create plugin package
        run: |
          node build.mjs --release
          ls -lh dist/

      - name: Get release notes from latest_release.md
        run: |
          if [ -f latest_release.md ]; then cp latest_release.md release-notes.md
          else echo "Release ${{ github.ref_name }}" > release-notes.md; fi
          cat release-notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME="${{ steps.plugin_info.outputs.PLUGIN_NAME }}"
          TAG="${{ steps.plugin_info.outputs.TAG }}"
          # Published on the website (which pushed this tag): attach the ZIP,
          # and if the notes box was left empty fill it from latest_release.md
          # (notes typed on the website stay). Otherwise create the release.
          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Release $TAG already exists - uploading the plugin ZIP to it"
            gh release upload "$TAG" --repo ${{ github.repository }} --clobber dist/*.zip
            BODY=$(gh release view "$TAG" --repo ${{ github.repository }} --json body --jq '.body // ""')
            if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
              echo "Release $TAG has no notes - using latest_release.md"
              gh release edit "$TAG" --repo ${{ github.repository }} --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" --repo ${{ github.repository }} \
              --title "$PLUGIN_NAME $TAG" --notes-file release-notes.md dist/*.zip
          fi

      - name: Announce on Discord
        # skipped when the DISCORD_WEBHOOK_URL secret isn't set; a failed post
        # shows as a warning and doesn't fail the release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.plugin_info.outputs.TAG }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > announce-notes.md
          bash .github/scripts/announce-discord.sh "$TAG" announce-notes.md
